{% load static %}
<!doctype html>

<html>
    <head>
        <meta charset="utf-8" />
        <meta name="viewport" content="width=device-width, initial-scale=1" />
        <title>bistRU</title>
        
        <link href="https://fonts.googleapis.com/css2?family=Figtree:wght@400;500;600;700&family=Lora:wght@400;500;600;700&display=swap" rel="stylesheet">
        <link href="{% static 'css/style.css'%}" rel="stylesheet">

    </head>
    <body>
        <header class="cabecalho">
            <a  href="#" class="logo">bistRU</a>
            <nav>
                <a href="#" class="link-inicio">INÍCIO</a>
                <a href="{% url 'bistru:entrar' %}" class="link-entrar">ENTRAR</a>
                <!-- <a href="{% url 'bistru:recuperar' %}" class="page-atual">RECUPERAR SENHA</a> -->
            </nav>
        </header>
        <div class="form-login">
            <form action="" method="POST">
                {% csrf_token %}
                <h1 class="titulo-forms">Esqueceu a senha?</h1>
                <!-- <div class="texto-info"> -->
                <p class="texto-info">Não se preocupe! Informe o e-mail cadastrado para redefinição de senha:</p>
                <!-- </div> -->
                <input type="email" name="email" id="id_email" placeholder="E-mail" required/>
                <button type="submit"> Enviar link de recuperação</button>
            </form>
        </div>
    </body>
</html>
